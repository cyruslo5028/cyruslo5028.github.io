<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background for the glow to pop (optional, but good for some browsers) -->
  <rect width="100" height="100" rx="20" fill="#050505" />
  
  <!-- Definitions for Gradients and Glow Filters -->
  <defs>
    <!-- Linear gradient for the letter C -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon outline -->
  <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" 
           fill="none" 
           stroke="url(#neonGradient)" 
           stroke-width="3" 
           filter="url(#glowCyan)" 
           opacity="0.8" />

  <!-- Abstract 'C' for Cyrus / Code -->
  <path d="M 65,35 
           L 45,35 
           A 15,15 0 0,0 30,50 
           A 15,15 0 0,0 45,65 
           L 65,65" 
        fill="none" 
        stroke="url(#neonGradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowCyan)" />
        
  <!-- Tech dot -->
  <circle cx="65" cy="50" r="4" fill="#00f0ff" filter="url(#glowCyan)" />
</svg>
